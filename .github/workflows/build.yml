name: Build Clash Liquid Glass APK v3

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Generate Project & Soft Pill Liquid Glass Source
        run: |
          mkdir -p app/src/main/java/com/example/clashliquidglass
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/assets

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
                  maven { url "https://api.xposed.info/" }
              }
          }
          rootProject.name = "ClashLiquidGlass"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.3.0' apply false
          }
          EOF

          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2048m
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.example.clashliquidglass'
              compileSdk 34

              defaultConfig {
                  applicationId "com.example.clashliquidglass"
                  minSdk 33
                  targetSdk 34
                  versionCode 3
                  versionName "3.0"
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              compileOnly 'de.robv.android.xposed:api:82'
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:label="ClashMeta 液态玻璃"
                  android:hasCode="true">
                  <meta-data
                      android:name="xposedmodule"
                      android:value="true" />
                  <meta-data
                      android:name="xposeddescription"
                      android:value="Clash Meta 柔润胶囊液态玻璃模块 (v3.0 仿底栏温润质感版)" />
                  <meta-data
                      android:name="xposedminversion"
                      android:value="93" />
                  <meta-data
                      android:name="xposedscope"
                      android:resource="@array/xposed_scope" />
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/res/values/arrays.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string-array name="xposed_scope">
                  <item>com.github.metacubex.clash.meta</item>
              </string-array>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/assets/xposed_init
          com.example.clashliquidglass.MainHook
          EOF

          cat << 'EOF' > app/src/main/java/com/example/clashliquidglass/MainHook.java
          package com.example.clashliquidglass;

          import android.app.Activity;
          import android.content.Context;
          import android.content.res.ColorStateList;
          import android.content.res.Configuration;
          import android.graphics.Canvas;
          import android.graphics.Color;
          import android.graphics.LinearGradient;
          import android.graphics.Paint;
          import android.graphics.RadialGradient;
          import android.graphics.RectF;
          import android.graphics.RuntimeShader;
          import android.graphics.Shader;
          import android.graphics.drawable.ColorDrawable;
          import android.graphics.drawable.Drawable;
          import android.os.Bundle;
          import android.util.TypedValue;
          import android.view.View;
          import android.view.ViewGroup;
          import android.view.ViewTreeObserver;
          import android.widget.FrameLayout;

          import de.robv.android.xposed.IXposedHookLoadPackage;
          import de.robv.android.xposed.XC_MethodHook;
          import de.robv.android.xposed.XposedBridge;
          import de.robv.android.xposed.XposedHelpers;
          import de.robv.android.xposed.callbacks.XC_LoadPackage;

          public class MainHook implements IXposedHookLoadPackage {

              private static final String TARGET_PACKAGE = "com.github.metacubex.clash.meta";
              private static final int TAG_GLASS_TYPE = 0x7F0B8881; // 1 = Card, 2 = Pill Label
              private static final int TAG_IS_ACCENT  = 0x7F0B8882;
              private static final int TAG_DRAWER     = 0x7F0B8883;
              private static final int TAG_AURORA_BG  = 0x7F0B8884;

              // 1:1 复刻参考图底栏的柔润胶囊液态玻璃着色器：
              // 乳白珍珠柔雾中心 + 余弦平滑宽边水滴折光带 + 左侧内嵌次级暗色胶囊 + 细腻纯白包边
              private static final String LIQUID_GLASS_AGSL =
                  "uniform float2 uSize;\n" +
                  "uniform float2 uScreenPos;\n" +
                  "uniform float2 uScreenSize;\n" +
                  "uniform float2 uInset;\n" +
                  "uniform float uCornerRadius;\n" +
                  "uniform float uBevelWidth;\n" +
                  "uniform float uRefractionAmount;\n" +
                  "uniform float uIsDark;\n" +
                  "uniform float uIsAccent;\n" +
                  "\n" +
                  "float sdRoundedBox(float2 p, float2 b, float r) {\n" +
                  "    float2 q = abs(p) - b + r;\n" +
                  "    return min(max(q.x, q.y), 0.0) + length(max(q, float2(0.0, 0.0))) - r;\n" +
                  "}\n" +
                  "\n" +
                  "float2 calcNormal(float2 p, float2 b, float r) {\n" +
                  "    float eps = 2.0;\n" +
                  "    float dx = sdRoundedBox(p + float2(eps, 0.0), b, r) - sdRoundedBox(p - float2(eps, 0.0), b, r);\n" +
                  "    float dy = sdRoundedBox(p + float2(0.0, eps), b, r) - sdRoundedBox(p - float2(0.0, eps), b, r);\n" +
                  "    return normalize(float2(dx, dy) + float2(0.0001, 0.0001));\n" +
                  "}\n" +
                  "\n" +
                  "// 柔和弥散的底层环境光场（提供自然柔润的透光层次，彻底去除生硬波纹）\n" +
                  "float3 sampleRawField(float2 worldCoord, float2 scrSize, float isDark) {\n" +
                  "    float2 uv = worldCoord / max(scrSize, float2(1.0, 1.0));\n" +
                  "    float3 base = isDark > 0.5 ? float3(0.18, 0.21, 0.26) : float3(0.88, 0.91, 0.95);\n" +
                  "    float3 c1 = isDark > 0.5 ? float3(0.32, 0.62, 0.92) : float3(0.55, 0.78, 0.98);\n" +
                  "    float3 c2 = isDark > 0.5 ? float3(0.24, 0.76, 0.58) : float3(0.48, 0.88, 0.70);\n" +
                  "    float3 c3 = isDark > 0.5 ? float3(0.58, 0.52, 0.88) : float3(0.82, 0.76, 0.96);\n" +
                  "\n" +
                  "    float w1 = smoothstep(0.75, 0.0, length(uv - float2(0.22, 0.20)));\n" +
                  "    float w2 = smoothstep(0.72, 0.0, length(uv - float2(0.78, 0.46)));\n" +
                  "    float w3 = smoothstep(0.78, 0.0, length(uv - float2(0.32, 0.82)));\n" +
                  "\n" +
                  "    float3 col = base;\n" +
                  "    col = mix(col, c1, w1 * 0.52);\n" +
                  "    col = mix(col, c2, w2 * 0.46);\n" +
                  "    col = mix(col, c3, w3 * 0.44);\n" +
                  "    return col;\n" +
                  "}\n" +
                  "\n" +
                  "// 5点高斯柔雾采样，模拟磨砂玻璃的柔和散射\n" +
                  "float3 sampleBlurredBackdrop(float2 worldCoord, float2 scrSize, float isDark, float spread) {\n" +
                  "    float3 c0 = sampleRawField(worldCoord, scrSize, isDark) * 0.40;\n" +
                  "    float3 c1 = sampleRawField(worldCoord + float2(spread, spread), scrSize, isDark) * 0.15;\n" +
                  "    float3 c2 = sampleRawField(worldCoord + float2(-spread, spread), scrSize, isDark) * 0.15;\n" +
                  "    float3 c3 = sampleRawField(worldCoord + float2(spread, -spread), scrSize, isDark) * 0.15;\n" +
                  "    float3 c4 = sampleRawField(worldCoord + float2(-spread, -spread), scrSize, isDark) * 0.15;\n" +
                  "    return c0 + c1 + c2 + c3 + c4;\n" +
                  "}\n" +
                  "\n" +
                  "half4 main(float2 coord) {\n" +
                  "    float2 boxHalf = (uSize - uInset * 2.0) * 0.5;\n" +
                  "    float2 centerPos = coord - uSize * 0.5;\n" +
                  "    float radius = min(uCornerRadius, min(boxHalf.x, boxHalf.y));\n" +
                  "    float dist = sdRoundedBox(centerPos, boxHalf, radius);\n" +
                  "\n" +
                  "    // 1. 抗锯齿平滑胶囊外缘裁剪\n" +
                  "    float alphaMask = 1.0 - smoothstep(-1.2, 0.6, dist);\n" +
                  "    if (alphaMask <= 0.002) {\n" +
                  "        return half4(0.0, 0.0, 0.0, 0.0);\n" +
                  "    }\n" +
                  "\n" +
                  "    // 2. 余弦曲线平滑水滴边缘（0.0 在胶囊内部，1.0 在最外圈弧边，过渡极其柔顺）\n" +
                  "    float edgeLinear = clamp(1.0 + dist / max(uBevelWidth, 1.0), 0.0, 1.0);\n" +
                  "    float meniscus = 0.5 - 0.5 * cos(edgeLinear * 3.1415926);\n" +
                  "    float meniscus2 = meniscus * meniscus;\n" +
                  "\n" +
                  "    // 3. 边缘液态凸透镜温和折射与极轻微光学色散\n" +
                  "    float2 normal = calcNormal(centerPos, boxHalf, radius);\n" +
                  "    float2 refractOffset = normal * meniscus2 * uRefractionAmount;\n" +
                  "    float2 worldPos = uScreenPos + coord;\n" +
                  "    float blurSpread = 18.0 * (1.0 - meniscus * 0.5);\n" +
                  "\n" +
                  "    float r = sampleBlurredBackdrop(worldPos - refractOffset * 1.06, uScreenSize, uIsDark, blurSpread).r;\n" +
                  "    float g = sampleBlurredBackdrop(worldPos - refractOffset, uScreenSize, uIsDark, blurSpread).g;\n" +
                  "    float b = sampleBlurredBackdrop(worldPos - refractOffset * 0.94, uScreenSize, uIsDark, blurSpread).b;\n" +
                  "    float3 backdropCol = float3(r, g, b);\n" +
                  "\n" +
                  "    // 4. 调配参考图同款的「乳白珍珠柔雾」玻璃基底（兼顾白色文字对比度与温润胶质感）\n" +
                  "    float3 milkyFrosted = uIsDark > 0.5 ? float3(0.56, 0.60, 0.66) : float3(0.87, 0.89, 0.92);\n" +
                  "    float3 activeGreenBlue = float3(0.20, 0.66, 0.52);\n" +
                  "    float3 glassBodyTint = mix(milkyFrosted, activeGreenBlue, uIsAccent * 0.58);\n" +
                  "    float frostWeight = uIsDark > 0.5 ? 0.54 : 0.68;\n" +
                  "    float3 glassColor = mix(backdropCol, glassBodyTint, frostWeight);\n" +
                  "\n" +
                  "    // 5. 复刻参考图左侧「首页」的内嵌柔灰小胶囊阴影衬底（位于左侧图标与文字区）\n" +
                  "    float innerPillW = min(boxHalf.x * 0.36, boxHalf.y * 1.45);\n" +
                  "    float innerPillH = boxHalf.y * 0.78;\n" +
                  "    float2 innerPillCenter = float2(-boxHalf.x + innerPillW + boxHalf.y * 0.22, 0.0);\n" +
                  "    float innerDist = sdRoundedBox(centerPos - innerPillCenter, float2(innerPillW, innerPillH), innerPillH);\n" +
                  "    float innerPillMask = 1.0 - smoothstep(-1.5, 1.5, innerDist);\n" +
                  "    glassColor = mix(glassColor, glassColor * 0.82, innerPillMask * 0.55);\n" +
                  "\n" +
                  "    // 6. 水滴内壁立体折光环（参考图右侧边缘的柔白厚玻璃内反光 + 浅凹槽）\n" +
                  "    float grooveBand = sin(edgeLinear * 3.1415926);\n" +
                  "    float sideCurveBoost = 0.4 + 0.6 * abs(normal.x);\n" +
                  "    float innerMeniscusGlow = grooveBand * grooveBand * (0.20 + 0.18 * sideCurveBoost);\n" +
                  "    float innerSubtleShade = smoothstep(0.15, 0.55, edgeLinear) * (1.0 - smoothstep(0.55, 0.90, edgeLinear)) * 0.07;\n" +
                  "\n" +
                  "    // 7. 顶部漫反射柔光与最外圈细腻纯白高光包边（Crisp Specular White Rim）\n" +
                  "    float topLight = clamp(-normal.y * 0.5 + 0.5, 0.0, 1.0);\n" +
                  "    float rimThickness = smoothstep(-3.2, -0.4, dist);\n" +
                  "    float whiteRim = rimThickness * (0.42 + 0.38 * max(topLight, abs(normal.x) * 0.85));\n" +
                  "\n" +
                  "    float3 finalRGB = glassColor - float3(innerSubtleShade) + float3(innerMeniscusGlow + whiteRim);\n" +
                  "    finalRGB = clamp(finalRGB, float3(0.0, 0.0, 0.0), float3(1.0, 1.0, 1.0));\n" +
                  "\n" +
                  "    // 整体保持温润通透的 92% 光学玻璃不透明度\n" +
                  "    float finalAlpha = alphaMask * 0.92;\n" +
                  "    return half4(finalRGB.r * finalAlpha, finalRGB.g * finalAlpha, finalRGB.b * finalAlpha, finalAlpha);\n" +
                  "}\n";

              @Override
              public void handleLoadPackage(XC_LoadPackage.LoadPackageParam lpparam) {
                  if (!TARGET_PACKAGE.equals(lpparam.packageName)) return;

                  XposedHelpers.findAndHookMethod(
                      Activity.class,
                      "onPostCreate",
                      Bundle.class,
                      new XC_MethodHook() {
                          @Override
                          protected void afterHookedMethod(MethodHookParam param) {
                              try {
                                  Activity activity = (Activity) param.thisObject;
                                  injectSoftBackdrop(activity);
                              } catch (Throwable t) {
                                  XposedBridge.log(t);
                              }
                          }
                      }
                  );

                  hookCardBackgroundColor(lpparam.classLoader, "androidx.cardview.widget.CardView");
                  hookCardBackgroundColor(lpparam.classLoader, "com.google.android.material.card.MaterialCardView");

                  XposedHelpers.findAndHookMethod(
                      ViewGroup.class,
                      "dispatchDraw",
                      Canvas.class,
                      new XC_MethodHook() {
                          @Override
                          protected void beforeHookedMethod(MethodHookParam param) {
                              try {
                                  View view = (View) param.thisObject;
                                  Object typeObj = view.getTag(TAG_GLASS_TYPE);
                                  if (!(typeObj instanceof Integer)) return;

                                  Drawable bg = view.getBackground();
                                  if (bg != null && bg.getAlpha() != 0) {
                                      bg.setAlpha(0);
                                  }

                                  LiquidGlassDrawer drawer = (LiquidGlassDrawer) view.getTag(TAG_DRAWER);
                                  if (drawer == null) {
                                      drawer = new LiquidGlassDrawer(view.getContext());
                                      view.setTag(TAG_DRAWER, drawer);
                                  }

                                  Canvas canvas = (Canvas) param.args[0];
                                  int glassType = (Integer) typeObj;
                                  boolean isAccent = Boolean.TRUE.equals(view.getTag(TAG_IS_ACCENT));
                                  drawer.draw(view, canvas, glassType, isAccent);
                              } catch (Throwable t) {
                                  XposedBridge.log(t);
                              }
                          }
                      }
                  );

                  hookTargetClass(lpparam.classLoader, "com.github.kr328.clash.design.view.LargeActionCard", 1);
                  hookTargetClass(lpparam.classLoader, "com.github.kr328.clash.design.view.LargeActionLabel", 2);
                  hookTargetClass(lpparam.classLoader, "com.github.kr328.clash.design.view.ActionLabel", 2);
                  hookTargetClass(lpparam.classLoader, "com.github.kr328.clash.design.view.ActionTextField", 2);
              }

              private void hookCardBackgroundColor(ClassLoader classLoader, String className) {
                  Class<?> cardClass = XposedHelpers.findClassIfExists(className, classLoader);
                  if (cardClass == null) return;

                  XposedHelpers.findAndHookMethod(
                      cardClass,
                      "setCardBackgroundColor",
                      int.class,
                      new XC_MethodHook() {
                          @Override
                          protected void beforeHookedMethod(MethodHookParam param) {
                              View v = (View) param.thisObject;
                              if (v.getTag(TAG_GLASS_TYPE) != null ||
                                  v.getClass().getName().endsWith("LargeActionCard")) {
                                  int color = (Integer) param.args[0];
                                  updateAccentTagFromColor(v, color);
                                  param.args[0] = Color.TRANSPARENT;
                              }
                          }
                      }
                  );

                  XposedHelpers.findAndHookMethod(
                      cardClass,
                      "setCardBackgroundColor",
                      ColorStateList.class,
                      new XC_MethodHook() {
                          @Override
                          protected void beforeHookedMethod(MethodHookParam param) {
                              View v = (View) param.thisObject;
                              if (v.getTag(TAG_GLASS_TYPE) != null ||
                                  v.getClass().getName().endsWith("LargeActionCard")) {
                                  ColorStateList csl = (ColorStateList) param.args[0];
                                  if (csl != null) {
                                      updateAccentTagFromColor(v, csl.getDefaultColor());
                                  }
                                  param.args[0] = ColorStateList.valueOf(Color.TRANSPARENT);
                              }
                          }
                      }
                  );
              }

              private void updateAccentTagFromColor(View v, int color) {
                  if (color == Color.TRANSPARENT) return;
                  float[] hsv = new float[3];
                  Color.colorToHSV(color, hsv);
                  boolean isVibrantAccent = hsv[1] > 0.35f && hsv[2] > 0.35f;
                  v.setTag(TAG_IS_ACCENT, isVibrantAccent);
              }

              private void hookTargetClass(ClassLoader cl, String className, final int glassType) {
                  Class<?> clazz = XposedHelpers.findClassIfExists(className, cl);
                  if (clazz == null) return;

                  XposedBridge.hookAllConstructors(clazz, new XC_MethodHook() {
                      @Override
                      protected void afterHookedMethod(MethodHookParam param) {
                          final View view = (View) param.thisObject;
                          view.setTag(TAG_GLASS_TYPE, glassType);
                          view.post(() -> prepareGlassView(view, glassType));
                      }
                  });
              }

              private void prepareGlassView(View targetView, int glassType) {
                  try {
                      targetView.setWillNotDraw(false);
                      targetView.setClipToOutline(false);
                      if (targetView instanceof ViewGroup) {
                          ((ViewGroup) targetView).setClipChildren(false);
                          ((ViewGroup) targetView).setClipToPadding(false);
                      }

                      if (glassType == 1) {
                          try {
                              Object cslObj = XposedHelpers.callMethod(targetView, "getCardBackgroundColor");
                              if (cslObj instanceof ColorStateList) {
                                  updateAccentTagFromColor(targetView, ((ColorStateList) cslObj).getDefaultColor());
                              }
                          } catch (Throwable ignored) {}
                          try {
                              XposedHelpers.callMethod(targetView, "setCardBackgroundColor", Color.TRANSPARENT);
                              XposedHelpers.callMethod(targetView, "setCardElevation", 0f);
                              XposedHelpers.callMethod(targetView, "setMaxCardElevation", 0f);
                              XposedHelpers.callMethod(targetView, "setStrokeWidth", 0);
                          } catch (Throwable ignored) {}
                      }

                      if (targetView.getBackground() != null) {
                          targetView.getBackground().setAlpha(0);
                      }
                      targetView.invalidate();
                  } catch (Throwable t) {
                      XposedBridge.log(t);
                  }
              }

              private void injectSoftBackdrop(Activity activity) {
                  if (activity.getWindow() == null) return;
                  View decor = activity.getWindow().getDecorView();
                  if (!(decor instanceof ViewGroup)) return;
                  final ViewGroup decorView = (ViewGroup) decor;

                  if (decorView.findViewWithTag(TAG_AURORA_BG) == null) {
                      SoftBackdropView backdropView = new SoftBackdropView(activity);
                      backdropView.setTag(TAG_AURORA_BG);
                      decorView.addView(backdropView, 0, new FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.MATCH_PARENT
                      ));
                  }

                  decorView.post(() -> clearOpaqueBackgrounds(decorView));

                  decorView.getViewTreeObserver().addOnScrollChangedListener(
                      new ViewTreeObserver.OnScrollChangedListener() {
                          @Override
                          public void onScrollChanged() {
                              invalidateAllGlassViews(decorView);
                          }
                      }
                  );
              }

              private void clearOpaqueBackgrounds(ViewGroup group) {
                  for (int i = 0; i < group.getChildCount(); i++) {
                      View child = group.getChildAt(i);
                      if (Boolean.TRUE.equals(child.getTag(TAG_AURORA_BG)) ||
                          child.getTag(TAG_GLASS_TYPE) != null) {
                          continue;
                      }
                      String clsName = child.getClass().getName();
                      if (!clsName.startsWith("com.github.kr328.clash.design.view.LargeAction") &&
                          !clsName.startsWith("com.github.kr328.clash.design.view.Action")) {
                          if (child.getBackground() instanceof ColorDrawable) {
                              child.setBackground(null);
                          }
                          if (child instanceof ViewGroup) {
                              clearOpaqueBackgrounds((ViewGroup) child);
                          }
                      }
                  }
              }

              private void invalidateAllGlassViews(ViewGroup group) {
                  for (int i = 0; i < group.getChildCount(); i++) {
                      View child = group.getChildAt(i);
                      if (child.getTag(TAG_GLASS_TYPE) != null) {
                          child.invalidate();
                      } else if (child instanceof ViewGroup) {
                          invalidateAllGlassViews((ViewGroup) child);
                      }
                  }
              }

              private static float dpToPx(Context context, float dp) {
                  return TypedValue.applyDimension(
                      TypedValue.COMPLEX_UNIT_DIP, dp, context.getResources().getDisplayMetrics()
                  );
              }

              // 柔和温润的浅雾环境背景，配合乳白玻璃产生参考图中的自然散射光感
              private static class SoftBackdropView extends View {
                  private final Paint paint = new Paint(Paint.ANTI_ALIAS_FLAG);

                  public SoftBackdropView(Context context) {
                      super(context);
                  }

                  @Override
                  protected void onDraw(Canvas canvas) {
                      super.onDraw(canvas);
                      int w = getWidth();
                      int h = getHeight();
                      if (w <= 0 || h <= 0) return;

                      boolean isDark = (getResources().getConfiguration().uiMode &
                          Configuration.UI_MODE_NIGHT_MASK) == Configuration.UI_MODE_NIGHT_YES;

                      canvas.drawColor(isDark ? Color.parseColor("#1C212B") : Color.parseColor("#E8EEF5"));

                      int c1 = isDark ? Color.parseColor("#554A90E2") : Color.parseColor("#6674B9FF");
                      int c2 = isDark ? Color.parseColor("#552ECC71") : Color.parseColor("#6655EFC4");
                      int c3 = isDark ? Color.parseColor("#449B59B6") : Color.parseColor("#55A29BFE");

                      paint.setShader(new RadialGradient(
                          w * 0.22f, h * 0.20f, w * 0.75f, c1, Color.TRANSPARENT, Shader.TileMode.CLAMP
                      ));
                      canvas.drawRect(0, 0, w, h, paint);

                      paint.setShader(new RadialGradient(
                          w * 0.78f, h * 0.46f, w * 0.72f, c2, Color.TRANSPARENT, Shader.TileMode.CLAMP
                      ));
                      canvas.drawRect(0, 0, w, h, paint);

                      paint.setShader(new RadialGradient(
                          w * 0.32f, h * 0.82f, w * 0.78f, c3, Color.TRANSPARENT, Shader.TileMode.CLAMP
                      ));
                      canvas.drawRect(0, 0, w, h, paint);
                  }
              }

              private static class LiquidGlassDrawer {
                  private RuntimeShader runtimeShader;
                  private final Paint shaderPaint = new Paint(Paint.ANTI_ALIAS_FLAG);
                  private final Paint shadowPaint = new Paint(Paint.ANTI_ALIAS_FLAG);
                  private final Paint fallbackFillPaint = new Paint(Paint.ANTI_ALIAS_FLAG);
                  private final Paint fallbackStrokePaint = new Paint(Paint.ANTI_ALIAS_FLAG);
                  private final RectF rectF = new RectF();
                  private final int[] locationTemp = new int[2];

                  private final float bevelWidthPx;
                  private final float refractionAmountPx;
                  private final float labelInsetXPx;
                  private final float labelInsetYPx;
                  private final float shadowRadiusPx;
                  private final float shadowOffsetYPx;
                  private final float screenW;
                  private final float screenH;

                  public LiquidGlassDrawer(Context context) {
                      this.bevelWidthPx = dpToPx(context, 18f);       // 宽幅柔滑水滴折光带
                      this.refractionAmountPx = dpToPx(context, 26f); // 温和透镜折射偏移
                      this.labelInsetXPx = dpToPx(context, 16f);
                      this.labelInsetYPx = dpToPx(context, 5f);
                      this.shadowRadiusPx = dpToPx(context, 10f);
                      this.shadowOffsetYPx = dpToPx(context, 4f);
                      this.screenW = context.getResources().getDisplayMetrics().widthPixels;
                      this.screenH = context.getResources().getDisplayMetrics().heightPixels;

                      shadowPaint.setStyle(Paint.Style.FILL);
                      shadowPaint.setColor(0x00000000);
                      shadowPaint.setShadowLayer(shadowRadiusPx, 0f, shadowOffsetYPx, 0x26000000);

                      try {
                          this.runtimeShader = new RuntimeShader(LIQUID_GLASS_AGSL);
                      } catch (Throwable t) {
                          XposedBridge.log("LiquidGlass AGSL init error: " + t.getMessage());
                          this.runtimeShader = null;
                      }
                  }

                  public void draw(View view, Canvas canvas, int glassType, boolean isAccent) {
                      int w = view.getWidth();
                      int h = view.getHeight();
                      if (w <= 0 || h <= 0) return;

                      float insetX = (glassType == 2) ? labelInsetXPx : 0f;
                      float insetY = (glassType == 2) ? labelInsetYPx : 0f;

                      // 核心几何改变：菜单项使用 100% 跑道圆胶囊半径（高度的一半），大卡片使用饱满大圆角
                      float boxH = h - insetY * 2f;
                      float pillRadius = (glassType == 2) ? (boxH * 0.5f) : (boxH * 0.44f);

                      // 1. 先绘制胶囊底部的柔和悬浮弥散阴影（复刻参考图底栏悬浮感）
                      rectF.set(insetX + 2f, insetY + 2f, w - insetX - 2f, h - insetY - 2f);
                      canvas.drawRoundRect(rectF, pillRadius, pillRadius, shadowPaint);

                      boolean isDark = (view.getResources().getConfiguration().uiMode &
                          Configuration.UI_MODE_NIGHT_MASK) == Configuration.UI_MODE_NIGHT_YES;

                      if (runtimeShader != null && canvas.isHardwareAccelerated()) {
                          view.getLocationOnScreen(locationTemp);

                          runtimeShader.setFloatUniform("uSize", (float) w, (float) h);
                          runtimeShader.setFloatUniform("uScreenPos", (float) locationTemp[0], (float) locationTemp[1]);
                          runtimeShader.setFloatUniform("uScreenSize", screenW, screenH);
                          runtimeShader.setFloatUniform("uInset", insetX, insetY);
                          runtimeShader.setFloatUniform("uCornerRadius", pillRadius);
                          runtimeShader.setFloatUniform("uBevelWidth", bevelWidthPx);
                          runtimeShader.setFloatUniform("uRefractionAmount", refractionAmountPx);
                          runtimeShader.setFloatUniform("uIsDark", isDark ? 1.0f : 0.0f);
                          runtimeShader.setFloatUniform("uIsAccent", isAccent ? 1.0f : 0.0f);

                          shaderPaint.setShader(runtimeShader);
                          canvas.drawRect(0, 0, w, h, shaderPaint);
                      } else {
                          rectF.set(insetX, insetY, w - insetX, h - insetY);
                          fallbackFillPaint.setColor(isAccent ? 0x992ECC71 : 0xB8C8D0D8);
                          canvas.drawRoundRect(rectF, pillRadius, pillRadius, fallbackFillPaint);

                          fallbackStrokePaint.setStyle(Paint.Style.STROKE);
                          fallbackStrokePaint.setStrokeWidth(dpToPx(view.getContext(), 1.4f));
                          fallbackStrokePaint.setShader(new LinearGradient(
                              rectF.left, rectF.top, rectF.right, rectF.bottom,
                              new int[]{0xEEFFFFFF, 0x55FFFFFF, 0xCCFFFFFF},
                              new float[]{0f, 0.5f, 1f},
                              Shader.TileMode.CLAMP
                          ));
                          canvas.drawRoundRect(rectF, pillRadius, pillRadius, fallbackStrokePaint);
                      }
                  }
              }
          }
          EOF

      - name: Build Signed APK
        run: gradle assembleDebug

      - name: Upload Ready-to-Install APK
        uses: actions/upload-artifact@v4
        with:
          name: ClashMeta-LiquidGlass-v3-APK
          path: app/build/outputs/apk/debug/app-debug.apk
